[project]
name = "ground"
version = "0.1.0"
description = "Ground station for sun-tracker: live telemetry plots and telecommands over USB serial"
authors = [
    { name = "Ivan Jankovic", email = "ivan.jankovic@email.cz" }
]
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pyserial>=3.5",
]

[project.scripts]
ground = "ground:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
