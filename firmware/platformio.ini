[platformio]
; Plain `pio run` and `-t upload` must act on the board only: `native` has no main() to link.
default_envs = esp32dev

[env]
; lib/core reads config.h, but PlatformIO does not put include/ on a library's path.
build_flags = -I include

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes  ; show what you type in the serial monitor

[env:esp32dev-sim]
extends = env:esp32dev
build_flags = ${env.build_flags} -DSIM_SUN

[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -std=c++17 -Wall -Wextra
build_src_filter = -<*>
